name: tests

# Windows and Linux, 3.10 and 3.12.  The matrix exists because the two failures
# that mattered were platform-specific: a cp1252 console that could not encode
# the Chinese labels, and an acceptance check that relied on a path being
# unwritable (true as a normal user, false as root on Linux).

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # The tool and its tests print Chinese.  Without these, a Windows runner whose
  # console code page is cp1252 raises UnicodeEncodeError from print() and the
  # step fails after the work has already succeeded.  The suites also guard
  # themselves (tests/console_setup.py), so this is belt and braces.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install openpyxl ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: ADIF enumeration contract tests
        run: python tests/test_enumerations.py

      - name: DXCC unit tests
        run: python tests/test_dxcc.py

      - name: QSL postage unit tests
        run: python tests/test_postage.py

      - name: End-to-end acceptance tests
        run: python tests/test_acceptance.py

      - name: Column catalogue agreement between the three front ends
        run: python tests/test_frontend_parity.py

      - name: Browser edition (static checks)
        # The browser edition runs the real converter under Pyodide.  Its live
        # check needs a browser and the Pyodide CDN; CI only asserts the static
        # properties, above all that the packed sources match src/.
        run: python tests/test_browser_edition.py --no-browser

      - name: Desktop UI and no-console tests
        run: python tests/test_gui.py

      - name: Web interface tests
        run: python tests/test_web.py

      - name: Fuzz the parser (500 inputs)
        run: python tests/test_fuzz.py 500 --seed 424242

  executable:
    # The packaged build is only meaningful on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl pyinstaller

      - name: Build the executable
        run: python build_exe.py --onefile

      - name: Verify the executable matches the source behaviour
        run: python tests/test_exe.py

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: adif2xlsx-windows
          path: dist/adif2xlsx.exe
